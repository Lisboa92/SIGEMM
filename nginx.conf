# Configuração Nginx para servir a SPA React e fazer proxy reverso
# para a API REST do backend (resolução DNS interna do Docker).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão para melhor desempenho
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Proxy reverso: /api/* → backend:3000
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback (rotas client-side do React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}